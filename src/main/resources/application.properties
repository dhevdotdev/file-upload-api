spring.application.name=file-upload-api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/file_uploads}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:file_upload_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:file_upload_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.storage.upload-dir=${APP_STORAGE_UPLOAD_DIR:./uploads}
app.storage.max-file-size-bytes=${APP_STORAGE_MAX_FILE_SIZE_BYTES:10485760}
app.storage.allowed-content-types[0]=image/jpeg
app.storage.allowed-content-types[1]=image/png
app.storage.allowed-content-types[2]=image/webp
app.storage.allowed-content-types[3]=image/gif
